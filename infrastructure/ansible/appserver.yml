---
# =============================================================================
# appserver.yml — Task 5: Application Deployment
# =============================================================================
# Target hosts : appservers (108.137.128.226, 108.137.104.154, 15.232.78.179)
# Run with     : ansible-playbook -i inventory.ini appserver.yml
# Purpose      : Install Docker, deploy PostgreSQL + Backend + Frontend
#                containers on every application server.
# =============================================================================

# -----------------------------------------------------------------------------
# PLAY 1: Docker Setup (all appservers)
# -----------------------------------------------------------------------------
- name: Appservers — Docker Setup
  hosts: appservers
  become: yes
  tasks:
    - name: Install Docker prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{
          ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - python3-docker
        state: present
        update_cache: yes

    - name: Enable and start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add {{ new_user }} to docker group
      user:
        name: "{{ new_user }}"
        groups: docker
        append: yes

    - name: Remove insecure-registry config (no longer needed — SSL active)
      file:
        path: /etc/docker/daemon.json
        state: absent

# -----------------------------------------------------------------------------
# PLAY 2: Deploy Containers (all appservers)
# -----------------------------------------------------------------------------
- name: Appservers — Database, Backend & Frontend
  hosts: app_nodes
  become: yes
  tasks:

    # --- Docker Network ---
    - name: Create Docker bridge network
      community.docker.docker_network:
        name: dumbmerch-network
        state: present

    # --- UFW Rules ---
    - name: Allow Frontend port 3000
      ufw:
        rule: allow
        port: "3000"
        proto: tcp

    - name: Allow Backend port 5000
      ufw:
        rule: allow
        port: "5000"
        proto: tcp

    - name: Allow PostgreSQL port 5432
      ufw:
        rule: allow
        port: "5432"
        proto: tcp

    # --- PostgreSQL ---
    - name: Create database volume directory
      file:
        path: /home/finaltask-rizal/db-data
        state: directory
        owner: finaltask-rizal
        mode: "0755"

    - name: Run PostgreSQL container
      community.docker.docker_container:
        name: dumbmerch-db
        image: postgres:15-alpine
        state: started
        restart_policy: always
        networks:
          - name: dumbmerch-network
        published_ports:
          - "5432:5432"
        env:
          POSTGRES_USER: "rizaladlan"
          POSTGRES_PASSWORD: "rizalbe"
          POSTGRES_DB: "dumbmerch"
        volumes:
          - /home/finaltask-rizal/db-data:/var/lib/postgresql/data

    # --- Backend ---
    - name: Create backend env directory
      file:
        path: /home/finaltask-rizal/be-dumbmerch
        state: directory
        mode: "0755"

    - name: Deploy Backend .env file
      template:
        src: templates/be.env.j2
        dest: /home/finaltask-rizal/be-dumbmerch/.env
        mode: "0600"

    - name: Run Backend container
      community.docker.docker_container:
        name: be-dumbmerch
        image: registry.rizaladlan.studentdumbways.my.id/be-dumbmerch:Staging
        state: started
        restart_policy: always
        pull: yes
        recreate: yes
        networks:
          - name: dumbmerch-network
        published_ports:
          - "5000:5000"
        volumes:
          - /home/finaltask-rizal/be-dumbmerch/.env:/app/.env:ro

    # --- Frontend ---
    - name: Run Frontend container
      community.docker.docker_container:
        name: fe-dumbmerch
        image: registry.rizaladlan.studentdumbways.my.id/fe-dumbmerch:Staging
        state: started
        restart_policy: always
        pull: yes
        recreate: yes
        networks:
          - name: dumbmerch-network
        published_ports:
          - "3000:80"

    # --- Smoke Tests ---
    - name: Verify Frontend is responding
      uri:
        url: "http://localhost:3000/"
        method: GET
        status_code: 200
      retries: 5
      delay: 3

    - name: Verify Backend is responding
      uri:
        url: "http://localhost:5000/"
        method: GET
        status_code: [ 200, 404 ]
      retries: 5
      delay: 3
